<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#3B0F70 0%,#5A1E86 48%,#7B2FA0 100%);background-attachment:fixed;color:#34223F;padding:40px 20px;line-height:1.6;}
button{font:inherit;}
.container{max-width:1200px;margin:0 auto;}
.nav-bar{background:white;padding:12px 20px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,0.05);display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.nav-bar a{padding:6px 14px;border-radius:16px;text-decoration:none;color:#6A238F;font-size:13px;font-weight:600;border:1px solid #d8c8e2;transition:all 0.2s;}
.nav-bar a:hover{background:#F6EEFA;}
.nav-bar a.current{background:linear-gradient(135deg,#6A238F 0%,#9A45BC 100%);color:white;border-color:#8C36AF;}
.nav-label{font-weight:600;color:#555;margin-right:4px;}
.header{text-align:center;margin-bottom:40px;padding:30px;background:linear-gradient(135deg,#FFF9FD 0%,#EEE7FF 100%);color:#3E275F;border-radius:12px;box-shadow:0 4px 12px rgba(33,14,58,0.18);}
.header h1{font-size:32px;margin-bottom:8px;}
.subtitle{font-size:14px;opacity:0.9;}
.stats,.latest-versions{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:14px;flex-wrap:wrap;}
.latest-versions span{padding:4px 12px;background:rgba(106,35,143,0.09);border:1px solid rgba(106,35,143,0.16);border-radius:14px;font-weight:600;}
.filter-bar{background:white;padding:16px 20px;border-radius:8px;margin-bottom:24px;box-shadow:0 2px 6px rgba(0,0,0,0.05);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.filter-bar .label{font-weight:600;margin-right:8px;color:#555;}
.filter-btn{padding:6px 14px;border:1px solid #d8c8e2;background:white;border-radius:16px;cursor:pointer;font-size:13px;transition:all 0.2s;}
.filter-btn:hover{background:#F6EEFA;}
.filter-btn.active{background:linear-gradient(135deg,#6A238F 0%,#9A45BC 100%);color:white;border-color:#8C36AF;}
.timeline{position:relative;padding:20px 0;}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#B468D5 0%,#7A269D 100%);transform:translateX(-50%);border-radius:2px;}
.timeline-item{position:relative;width:50%;padding:12px 30px;}
.timeline-item.left{left:0;}
.timeline-item.right{left:50%;}
.timeline-dot{position:absolute;top:28px;width:16px;height:16px;background:white;border:3px solid #A14CC5;border-radius:50%;z-index:2;}
.timeline-item.left .timeline-dot{right:-8px;}
.timeline-item.right .timeline-dot{left:-8px;}
.timeline-card{background:white;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);overflow:hidden;transition:box-shadow 0.2s;}
.timeline-card:hover{box-shadow:0 6px 18px rgba(0,0,0,0.12);}
.card-header{width:100%;border:0;background:linear-gradient(135deg,#5C1D82 0%,#9A45BC 100%);color:white;padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;text-align:left;}
.card-header-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.card-date{font-size:12px;opacity:0.85;}
.card-product{font-size:14px;font-weight:600;}
.card-header-right{display:flex;align-items:center;gap:6px;}
.version-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
.version-badge.version{background:white;color:#5C1D82;}
.version-badge.count{background:rgba(255,255,255,0.2);}
.card-toggle{font-size:12px;margin-left:6px;transition:transform 0.2s;}
.timeline-card.collapsed .card-toggle{transform:rotate(-90deg);}
.timeline-card.collapsed .card-body{display:none;}
.card-body{padding:16px;}
.group-label{display:inline-block;margin-bottom:12px;padding:4px 10px;border-radius:12px;background:#F4EAF8;color:#6A238F;font-size:12px;font-weight:700;}
.change-content{padding:10px 12px;background:#FAF7FC;border-left:3px solid #8C36AF;border-radius:4px;}
.change-list{padding-left:22px;font-size:13px;color:#2c3e50;}
.change-list li+li{margin-top:4px;}
@media (max-width:768px){
  html,body{overflow-x:hidden;}
  body{padding:20px 10px;}
  .container{width:100%;min-width:0;}
  .nav-bar{align-items:flex-start;}
  .nav-label{flex-basis:100%;}
  .nav-bar a{flex:0 0 auto;}
  .stats,.latest-versions{flex-direction:column;align-items:center;gap:8px;}
  .timeline::before{left:16px;}
  .timeline-item{width:100%;left:0!important;padding:8px 0 8px 40px;}
  .timeline-item .timeline-dot{left:8px!important;right:auto!important;}
  .card-header{align-items:flex-start;flex-direction:column;}
  .card-header-right{width:100%;flex-wrap:wrap;}
  .header h1{font-size:22px;}
}

<script type="text/plain" id="changelog-source">
Part 1 - L MAX

Current latest version: PPM 1.02 / EVCC Single Phase 1.01 / EVCC Three Phase 1.02 (Last updated 2026/7/21; earlier version changes are hidden)

L MAX Firmware Releases

2026/7/16 - L MAX (Single Phase) EVCC V1.00 -> V1.01 (Latest Single-Phase EVCC, 3 items)


Optimized leakage current detection process.

Added leakage current module self-check.

Optimized EVCC-PPM communication.


2026/7/14 - L MAX (Three Phase) EVCC V1.01 -> V1.02 (Latest Three-Phase EVCC, 2 items)


Added PLC module adaptation.

Optimized EVCC-PPM communication.


2026/7/14 - L MAX (Single/Three Phase) PPM V1.01 -> V1.02 (Latest PPM, 5 items)


Optimized card deletion process.

Optimized Modbus offline current management.

Optimized Modbus data query logic.

Optimized memory management for offline mode parameter settings.

Added PLC support.


2026/6/6 - L MAX (Three Phase) EVCC V0.42 -> V1.01 (24 items)


Optimized leakage current detection process.

Added leakage current module self-check.

Added UK regulation compliance: PEN detection + off-peak charging.

Delayed state can be canceled via APP to start immediately.

Added SN data validity verification.

Added vehicle-side overcurrent protection: auto-stop after 30s persistent overcurrent.

Optimized INV voltage display under INV direct connection.

Optimized leakage current detection process.

Added leakage current module self-check.

External meter direct connection compatible with 6CT Chint meter.

In pile pause state, auto-enter vehicle pause after 60 seconds.

Modbus new real-time power and max power registers.

Added PV linkage timing function, supporting 8 time periods.

Optimized PV linkage solution, compatible with three-phase and single-phase INV.

Optimized power-on read handling, more stable operation.

Added configuration item for meter data source, optimized alarm flow.

Optimized stop reason report for start/delayed state gun pull.

Optimized smart temperature control load-up function.

Optimized current control under PV linkage offline scenario.

Optimized PV linkage offline handling under INV direct connection.

Optimized timed startup success rate.

Optimized fault information synchronization consistency.

Optimized Modbus single/three-phase switching state management.

Optimized Modbus single/three-phase switching interval reset logic.


2026/5/14 - L MAX (Single/Three Phase) PPM V0.46 -> V1.01 (11 items)


New Modbus register support.

Optimized Modbus gun status.

Optimized network disconnect and restart logic.

New UK regulation and peak time period adaptation, covering all charging methods.

New time zone adaptation, supporting all timed charging behaviors.

Optimized TCP-TLS connection stability.

Optimized Modbus-TCP single/three-phase data processing.

Optimized repeated network connection stability.

Improved UK regulation test.

Optimized OCPP connection stability.

Optimized time zone daylight saving time handling.


2026/5/14 - L MAX (Single Phase) EVCC V0.42 -> V1.00 (6 items)


New UK regulation compliance: PEN detection + off-peak charging.

Faster start from delayed state.

New SN data validity verification.

New vehicle-side overcurrent protection: auto-stop after 30s persistent overcurrent.

Optimized INV voltage display under INV direct connection.

Support OCPP and FoxESS Cloud external meter upload frequency setting.


2025/12/1 - L MAX (Single/Three Phase) V0.44 -> V0.46 (3 items)


Add operating parameters: Total power of INV, measurement of three-phase power;

Add parameter: PE grounding detection (support for single-phase pile);

Add functions for automatic timing increase/query/clearing and triggering of photovoltaic linkage.


2025/12/1 - L MAX (Single Phase) V0.41 -> V0.42 (3 items)


A new photovoltaic linkage timing function has been added, supporting 8 time periods. During each period, it processes in a rapid mode, and during the period, the current real-time power of the charging station will be sent to INV. Outside the period, the sending will stop, and INV will actively reset it.

Photovoltaic linkage photovoltaic boost has been added. New options include rapid boost (external electricity meter current is less than -1A) and sequential boost (external electricity meter current is greater than or equal to -1A).

A new configuration function for PE detection switch has been added.


2025/10/1 - L MAX (Single/Three Phase) V0.43 -> V0.44 (3 items)


Optimize the notification of network connection status. Reduce the interval for uploading status notifications.

Optimize the restart of the network module. Improve the issue where multiple restarts of the LAN and Wi-Fi modules occasionally cause errors.

Optimize the start time of the reservation. When starting the reservation in a delayed manner, the actual start time of the reservation remains the set reservation time.


2025/10/1 - L MAX (Three Phase) V0.41 -> V0.42 (5 items)


Adjust the current threshold for the station-level photovoltaic linkage from suspension to restoration to 6.5A;

Add support for three-phase photovoltaic direct connection, including a 485 interface for communication with three-phase inverters;

Remove the silent period logic, abandon the maximum action count parameter, modify the default value and range of the minimum switching interval, and optimize the photovoltaic linkage logic (consistent with AEB22KW);

Add parameters such as station-level photovoltaic linkage switch, function insufficient for 6A charging switch, maximum battery discharge power, frequency of external meter upload, OCPP external meter upload frequency, etc.;

Add station-level photovoltaic linkage logic.


2025/10/1 - L MAX (Single Phase) V0.40 -> V0.41 (1 item)


Added configuration items for electric meter data sources, and optimized the alarm process for electric meter data.


2025/9 - L MAX (Single/Three Phase) V0.42 -> V0.43 (5 items)


Bluetooth encryption.

Add a new startup method. Swipe card timed activation.

New instructions: Card swiping start time period setting, card swiping start time period query.

New instructions: Photovoltaic linkage timing setting, Photovoltaic linkage timing query.

New parameters: Source of electricity meter data.


2025/9 - L MAX (Single Phase) V0.40 -> V0.41 (7 items)


485 adds inverter communication command logic, compatible with inverter, Chint meter, Donghong meter, and RCB control box commands.

Modification of alarm logic for electricity meters and inverters.

Add photovoltaic direct connection logic.

Modify the minimum switching interval for photovoltaic linkage and load balancing.

New photovoltaic linkage energy supply shortage suspension strategy.

Relay abnormality triggers leakage protection logic modification.

Add a configuration item for the source of electricity meter data and optimize the alarm process for electricity meter data.
</script>
<script>
const raw=document.getElementById("changelog-source").textContent.trim();

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,function(character){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];
  });
}

function normalizeDate(value){
  const parts=value.split("/");
  return parts.length===2
    ? parts[0]+"-"+parts[1].padStart(2,"0")
    : parts[0]+"-"+parts[1].padStart(2,"0")+"-"+parts[2].padStart(2,"0");
}

function getGroup(phase,type){
  if(type==="PPM"||phase==="Single/Three Phase")return {id:"ppm",name:"PPM - Single/Three Phase"};
  if(phase==="Single Phase")return {id:"evcc-single",name:"EVCC - Single Phase"};
  return {id:"evcc-three",name:"EVCC - Three Phase"};
}

function parseReleases(){
  const pattern=/^(\d{4}\/\d{1,2}(?:\/\d{1,2})?) - L MAX \(([^)]+)\)(?: (PPM|EVCC))? V([0-9.]+) -> V([0-9.]+) \(([^)]*)\)$/gm;
  const headings=Array.from(raw.matchAll(pattern));
  return headings.map(function(heading,index){
    const start=heading.index+heading[0].length;
    const end=index+1<headings.length?headings[index+1].index:raw.length;
    const items=raw.slice(start,end).split(/\n+/).map(function(line){return line.trim();}).filter(Boolean);
    const group=getGroup(heading[2],heading[3]);
    const declaredMatch=heading[6].match(/(\d+) items?/);
    const declared=declaredMatch?Number(declaredMatch[1]):items.length;
    if(declared!==items.length)console.warn("Item count mismatch",heading[0],declared,items.length);
    return {
      date:normalizeDate(heading[1]),
      group:group.id,
      groupName:group.name,
      from:"V"+heading[4],
      to:"V"+heading[5],
      latest:/Latest/i.test(heading[6]),
      items:items
    };
  });
}

const releases=parseReleases();
const timeline=document.getElementById("timeline");
document.getElementById("record-count").textContent=releases.length;
document.getElementById("item-count").textContent=releases.reduce(function(total,release){
  return total+release.items.length;
},0);

function renderTimeline(filter){
  const visible=filter==="all"?releases:releases.filter(function(release){return release.group===filter;});
  timeline.innerHTML=visible.map(function(release,index){
    const list=release.items.map(function(item){return "<li>"+escapeHtml(item)+"</li>";}).join("");
    const latest=release.latest?'<span class="version-badge count">Latest</span>':"";
    const expanded=index<3;
    return '<article class="timeline-item '+(index%2===0?"left":"right")+'">'+
      '<div class="timeline-dot"></div>'+
      '<div class="timeline-card '+(expanded?"":"collapsed")+'">'+
        '<button class="card-header" type="button" aria-expanded="'+expanded+'">'+
          '<span class="card-header-left"><span class="card-date">'+release.date+'</span><span class="card-product">'+escapeHtml(release.groupName)+'</span></span>'+
          '<span class="card-header-right">'+latest+'<span class="version-badge version">'+release.from+' -> '+release.to+'</span><span class="version-badge count">'+release.items.length+' items</span><span class="card-toggle">v</span></span>'+
        '</button>'+
        '<div class="card-body"><span class="group-label">'+escapeHtml(release.groupName)+'</span><div class="change-content"><ol class="change-list">'+list+'</ol></div></div>'+
      '</div>'+
    '</article>';
  }).join("");
}

timeline.addEventListener("click",function(event){
  const header=event.target.closest(".card-header");
  if(!header)return;
  const card=header.closest(".timeline-card");
  card.classList.toggle("collapsed");
  header.setAttribute("aria-expanded",String(!card.classList.contains("collapsed")));
});

document.querySelector(".filter-bar").addEventListener("click",function(event){
  const button=event.target.closest(".filter-btn");
  if(!button)return;
  document.querySelectorAll(".filter-btn").forEach(function(item){item.classList.remove("active");});
  button.classList.add("active");
  renderTimeline(button.dataset.filter);
});

renderTimeline("all");
</script>
