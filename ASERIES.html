<title>A Series - Product Changelog</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#3B0F70 0%,#5A1E86 48%,#7B2FA0 100%);background-attachment:fixed;color:#34223F;padding:40px 20px;line-height:1.6;}
button{font:inherit;}
.container{max-width:1200px;margin:0 auto;}
.nav-bar{background:white;padding:12px 20px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,0.05);display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.nav-bar a{padding:6px 14px;border-radius:16px;text-decoration:none;color:#6A238F;font-size:13px;font-weight:600;border:1px solid #d8c8e2;transition:all 0.2s;}
.nav-bar a:hover{background:#F6EEFA;}
.nav-bar a.current{background:linear-gradient(135deg,#6A238F 0%,#9A45BC 100%);color:white;border-color:#8C36AF;}
.nav-label{font-weight:600;color:#555;margin-right:4px;}
.header{text-align:center;margin-bottom:40px;padding:30px;background:linear-gradient(135deg,#FFF9FD 0%,#EEE7FF 100%);color:#3E275F;border-radius:12px;box-shadow:0 4px 12px rgba(33,14,58,0.18);}
.header h1{font-size:32px;margin-bottom:8px;}
.subtitle{font-size:14px;opacity:0.9;}
.stats,.latest-versions{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:14px;flex-wrap:wrap;}
.latest-versions span{padding:4px 12px;background:rgba(106,35,143,0.09);border:1px solid rgba(106,35,143,0.16);border-radius:14px;font-weight:600;}
.filter-bar{background:white;padding:16px 20px;border-radius:8px;margin-bottom:24px;box-shadow:0 2px 6px rgba(0,0,0,0.05);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.filter-bar .label{font-weight:600;margin-right:8px;color:#555;}
.filter-btn{padding:6px 14px;border:1px solid #d8c8e2;background:white;border-radius:16px;cursor:pointer;font-size:13px;transition:all 0.2s;}
.filter-btn:hover{background:#F6EEFA;}
.filter-btn.active{background:linear-gradient(135deg,#6A238F 0%,#9A45BC 100%);color:white;border-color:#8C36AF;}
.timeline{position:relative;padding:20px 0;}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#B468D5 0%,#7A269D 100%);transform:translateX(-50%);border-radius:2px;}
.timeline-item{position:relative;width:50%;padding:12px 30px;}
.timeline-item.left{left:0;}
.timeline-item.right{left:50%;}
.timeline-dot{position:absolute;top:28px;width:16px;height:16px;background:white;border:3px solid #A14CC5;border-radius:50%;z-index:2;}
.timeline-item.left .timeline-dot{right:-8px;}
.timeline-item.right .timeline-dot{left:-8px;}
.timeline-card{background:white;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);overflow:hidden;transition:box-shadow 0.2s;}
.timeline-card:hover{box-shadow:0 6px 18px rgba(0,0,0,0.12);}
.card-header{width:100%;border:0;background:linear-gradient(135deg,#5C1D82 0%,#9A45BC 100%);color:white;padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;text-align:left;}
.card-header-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.card-date{font-size:12px;opacity:0.85;}
.card-product{font-size:14px;font-weight:600;}
.card-header-right{display:flex;align-items:center;gap:6px;}
.version-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
.version-badge.version{background:white;color:#5C1D82;}
.version-badge.count{background:rgba(255,255,255,0.2);}
.card-toggle{font-size:12px;margin-left:6px;transition:transform 0.2s;}
.timeline-card.collapsed .card-toggle{transform:rotate(-90deg);}
.timeline-card.collapsed .card-body{display:none;}
.card-body{padding:16px;}
.group-label,.release-note{display:inline-block;margin-bottom:12px;padding:4px 10px;border-radius:12px;background:#F4EAF8;color:#6A238F;font-size:12px;font-weight:700;}
.release-note{margin-left:6px;background:#FFF3D9;color:#8A5700;}
.change-content{padding:10px 12px;background:#FAF7FC;border-left:3px solid #8C36AF;border-radius:4px;}
.change-list{padding-left:22px;font-size:13px;color:#2c3e50;}
.change-list li+li{margin-top:4px;}
@media (max-width:768px){
  html,body{overflow-x:hidden;}
  body{padding:20px 10px;}
  .container{width:100%;min-width:0;}
  .nav-bar{align-items:flex-start;}
  .nav-label{flex-basis:100%;}
  .nav-bar a{flex:0 0 auto;}
  .stats,.latest-versions{flex-direction:column;align-items:center;gap:8px;}
  .timeline::before{left:16px;}
  .timeline-item{width:100%;left:0!important;padding:8px 0 8px 40px;}
  .timeline-item .timeline-dot{left:8px!important;right:auto!important;}
  .card-header{align-items:flex-start;flex-direction:column;}
  .card-header-right{width:100%;flex-wrap:wrap;}
  .header h1{font-size:22px;}
}
</style>

  <header class="header">

    <div class="stats">
      <div>Total <strong id="record-count">0</strong> records</div>
      <div><strong id="item-count">0</strong> update items</div>

<script type="text/plain" id="changelog-source">
A-E-B Firmware Releases

2026/7/18 - A-E-B (Single/Three Phase) PPM V1.09 -> V1.10 (Latest PPM, 8 items)


Optimized network status notification (handling WiFi incorrect connection scenarios).

Optimized Modbus data query processing.

Optimized order generation logic.

Optimized operation mode switching, supports switching during charging or firmware upgrade.

Optimized platform data processing logic.

Added Austria regulation support, compatible with UK regulation and all known charging behaviors.

Added operating data information.

Added system parameter battery_drain_prevention.


2026/7/18 - A-E-B (Three phase) EVCC V1.04 -> V1.06 (Latest Three-Phase EVCC, 4 items)


Adjusted PEN over/under-voltage thresholds to 262.2V and 207V.

Added CP negative voltage abnormality detection.

Optimized EVCC-PPM communication.

Added vehicle-side reservation configuration.


2026/7/18 - A-E-B (Single phase) EVCC V1.07 -> V1.08 (Latest Single-Phase EVCC, 3 items)


Added CP negative voltage abnormality detection.

Optimized EVCC-PPM communication.

Added vehicle-side reservation configuration.


2026/5/25 - A-E-B (Single/Three Phase) PPM V1.08 -> V1.09 (7 items)


Optimized pile reservation count query function.

Optimized reservation state stability for card timing + off-peak under power-off restart.

Optimized UK regulation, supporting card timing function.

Optimized OCPP charging configuration.

Optimized Modbus protocol data parsing.

Optimized OCPP connection stability.

Optimized Modbus data processing flow.


2026/5/25 - A-E-B (Single Phase) EVCC V1.05 -> V1.07 (4 items)


Optimized AC relay fault detection.

Optimized INV voltage display under INV direct connection.

Optimized smart charging current setting under OCPP mode.

Adjusted PEN over/under-voltage threshold to 262.2V and 207V.


2026/4/2 - A-E-B (Three Phase) EVCC V1.03 -> V1.04 (2 items)


Optimized UK regulation compliance: PEN detection + off-peak charging.

Faster start from delayed state.


2026/3/14 - A-E-B (Three Phase) EVCC V1.01 -> V1.03 (6 items)


Function for timing pause and recovery when using timed charging;

Added vehicle failure protection function. When the actual current of the vehicle exceeds the overcurrent threshold set by the current charging station and persists for 30 seconds, the charging station reports an overcurrent fault and stops charging;

Adapted to the INV direct connection (CT direct connection) scheme. When the detected INV voltage is 0, the charging station replaces the INV voltage with the input voltage of the charging station;

Added gun line capacity detection function. The charging station automatically limits the charging current size based on the gun line capacity;

Added SN data validity verification function;

Added PEN enable switch configuration item and PEN processing function.


2026/3 - A-E-B (Single/Three Phase) V1.04 -> V1.06 (2 items)


Optimize 4G initialization. Increase the initialization time, including obtaining the SIM card number and signal.

Add system parameters. PEN parameter.


2026/3 - A-E-B (Single Phase) V1.03 -> V1.04 (5 items)


Function for timing pause and recovery when using timed charging;

Added gun line capacity detection function. The charging station automatically limits the charging current based on the gun line capacity;

Added vehicle failure protection function. When the actual current of the vehicle exceeds the overcurrent threshold of the current control of the current charging station and persists for 30 seconds, the charging station reports an overcurrent fault and stops charging;

Added SN data validity verification function;

Added PEN enable switch configuration item and PEN processing function.


2025/12 - A-E-B (Single/Three Phase) V1.03 -> V1.04 (1 item)


Add "Country" system parameters.


2025/12 - A-E-B (Single Phase) V1.00 -> V1.03 (4 items)


A new photovoltaic linkage timing function has been added, supporting 8 time periods. During each period, it processes in a rapid mode, and it will send the current real-time power of the charging station to INV within the period. It stops sending outside the period, and INV will actively reset it.

Photovoltaic linkage photovoltaic boost has been added, with new options for rapid boost (external electricity meter current less than -1A) and sequential boost (external electricity meter current greater than or equal to -1A).

A new configuration item for the data source of the electricity meter has been added, and the alarm process for electricity meter data has been optimized.

A new configuration function for the PE detection switch has been added.


2025/9 - A-E-B (Single/Three Phase) V1.01 -> V1.02 (4 items)


Optimize Modbus charging. After communication timeout, the offline current will not be synchronized to the maximum charging current.

New feature. Card swipe timing.

New feature: Photovoltaic linkage timing.

New OCPP function. Support for changing the URL connection to another OCPP platform on the OCPP platform.


2025/9 - A-E-B (Three Phase) V1.00 -> V1.01 (1 item)


Add station level photovoltaic linkage offline control logic.
</script>
<script>
const raw=document.getElementById("changelog-source").textContent.trim();

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,function(character){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];
  });
}

function normalizeDate(value){
  const parts=value.split("/");
  return parts.length===2
    ? parts[0]+"-"+parts[1].padStart(2,"0")
    : parts[0]+"-"+parts[1].padStart(2,"0")+"-"+parts[2].padStart(2,"0");
}

function getGroup(phase,type){
  const normalized=phase.toLowerCase();
  if(type==="PPM"||normalized==="single/three phase")return {id:"ppm",name:"A-E-B PPM - Single/Three Phase"};
  if(normalized==="single phase")return {id:"evcc-single",name:"A-E-B EVCC - Single Phase"};
  return {id:"evcc-three",name:"A-E-B EVCC - Three Phase"};
}

function parseReleases(){
  const pattern=/^(\d{4}\/\d{1,2}(?:\/\d{1,2})?) - A-E-B \(([^)]+)\)(?: (PPM|EVCC))? V([0-9.]+) -> V([0-9.]+) \(([^)]*)\)$/gm;
  const headings=Array.from(raw.matchAll(pattern));
  return headings.map(function(heading,index){
    const start=heading.index+heading[0].length;
    const end=index+1<headings.length?headings[index+1].index:raw.length;
    const items=raw.slice(start,end).split(/\n+/).map(function(line){return line.trim();}).filter(Boolean);
    const declaredMatch=heading[6].match(/(\d+) items?/);
    const declared=declaredMatch?Number(declaredMatch[1]):items.length;
    if(declared!==items.length)console.warn("Item count mismatch",heading[0],declared,items.length);
    const group=getGroup(heading[2],heading[3]);
    return {
      date:normalizeDate(heading[1]),
      group:group.id,
      groupName:group.name,
      from:"V"+heading[4],
      to:"V"+heading[5],
      latest:/Latest/i.test(heading[6]),
      items:items
    };
  });
}

const releases=parseReleases();
const timeline=document.getElementById("timeline");
document.getElementById("record-count").textContent=releases.length;
document.getElementById("item-count").textContent=releases.reduce(function(total,release){
  return total+release.items.length;
},0);

function renderTimeline(filter){
  const visible=filter==="all"?releases:releases.filter(function(release){return release.group===filter;});
  timeline.innerHTML=visible.map(function(release,index){
    const list=release.items.map(function(item){return "<li>"+escapeHtml(item)+"</li>";}).join("");
    const latest=release.latest?'<span class="version-badge count">Latest</span>':"";
    const expanded=index<3;
    return '<article class="timeline-item '+(index%2===0?"left":"right")+'">'+
      '<div class="timeline-dot"></div>'+
      '<div class="timeline-card '+(expanded?"":"collapsed")+'">'+
        '<button class="card-header" type="button" aria-expanded="'+expanded+'">'+
          '<span class="card-header-left"><span class="card-date">'+release.date+'</span><span class="card-product">'+escapeHtml(release.groupName)+'</span></span>'+
          '<span class="card-header-right">'+latest+'<span class="version-badge version">'+release.from+' -> '+release.to+'</span><span class="version-badge count">'+release.items.length+' items</span><span class="card-toggle">v</span></span>'+
        '</button>'+
        '<div class="card-body"><span class="group-label">'+escapeHtml(release.groupName)+'</span><div class="change-content"><ol class="change-list">'+list+'</ol></div></div>'+
      '</div>'+
    '</article>';
  }).join("");
}

timeline.addEventListener("click",function(event){
  const header=event.target.closest(".card-header");
  if(!header)return;
  const card=header.closest(".timeline-card");
  card.classList.toggle("collapsed");
  header.setAttribute("aria-expanded",String(!card.classList.contains("collapsed")));
});

document.querySelector(".filter-bar").addEventListener("click",function(event){
  const button=event.target.closest(".filter-btn");
  if(!button)return;
  document.querySelectorAll(".filter-btn").forEach(function(item){item.classList.remove("active");});
  button.classList.add("active");
  renderTimeline(button.dataset.filter);
});

renderTimeline("all");
</script>
