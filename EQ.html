<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EQ - Product Changelog</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#3B0F70 0%,#5A1E86 48%,#7B2FA0 100%);background-attachment:fixed;color:#34223F;padding:40px 20px;line-height:1.6;}
button{font:inherit;}
.container{max-width:1200px;margin:0 auto;}
.nav-bar{background:white;padding:12px 20px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,0.05);display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.nav-bar a{padding:6px 14px;border-radius:16px;text-decoration:none;color:#6A238F;font-size:13px;font-weight:600;border:1px solid #d8c8e2;transition:all 0.2s;}
.nav-bar a:hover{background:#F6EEFA;}
.nav-bar a.current{background:linear-gradient(135deg,#6A238F 0%,#9A45BC 100%);color:white;border-color:#8C36AF;}
.nav-label{font-weight:600;color:#555;margin-right:4px;}
.header{text-align:center;margin-bottom:40px;padding:30px;background:linear-gradient(135deg,#FFF9FD 0%,#EEE7FF 100%);color:#3E275F;border-radius:12px;box-shadow:0 4px 12px rgba(33,14,58,0.18);}
.header h1{font-size:32px;margin-bottom:8px;}
.subtitle{font-size:14px;opacity:0.9;}
.stats,.latest-versions{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:14px;flex-wrap:wrap;}
.latest-versions span{padding:4px 12px;background:rgba(106,35,143,0.09);border:1px solid rgba(106,35,143,0.16);border-radius:14px;font-weight:600;}
.filter-bar{background:white;padding:16px 20px;border-radius:8px;margin-bottom:24px;box-shadow:0 2px 6px rgba(0,0,0,0.05);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.filter-bar .label{font-weight:600;margin-right:8px;color:#555;}
.filter-btn{padding:6px 14px;border:1px solid #d8c8e2;background:white;border-radius:16px;cursor:pointer;font-size:13px;transition:all 0.2s;}
.filter-btn:hover{background:#F6EEFA;}
.filter-btn.active{background:linear-gradient(135deg,#6A238F 0%,#9A45BC 100%);color:white;border-color:#8C36AF;}
.timeline{position:relative;padding:20px 0;}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#B468D5 0%,#7A269D 100%);transform:translateX(-50%);border-radius:2px;}
.timeline-item{position:relative;width:50%;padding:12px 30px;}
.timeline-item.left{left:0;}
.timeline-item.right{left:50%;}
.timeline-dot{position:absolute;top:28px;width:16px;height:16px;background:white;border:3px solid #A14CC5;border-radius:50%;z-index:2;}
.timeline-item.left .timeline-dot{right:-8px;}
.timeline-item.right .timeline-dot{left:-8px;}
.timeline-card{background:white;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);overflow:hidden;transition:box-shadow 0.2s;}
.timeline-card:hover{box-shadow:0 6px 18px rgba(0,0,0,0.12);}
.card-header{width:100%;border:0;background:linear-gradient(135deg,#5C1D82 0%,#9A45BC 100%);color:white;padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;text-align:left;}
.card-header-left{display:flex;flex-direction:column;gap:2px;}
.card-date{font-size:12px;opacity:0.85;}
.card-product{font-size:15px;font-weight:600;}
.card-header-right{display:flex;align-items:center;gap:6px;}
.version-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
.version-badge.old{background:rgba(255,255,255,0.2);}
.version-badge.new{background:white;color:#5C1D82;}
.version-arrow{font-size:16px;opacity:0.8;}
.card-toggle{font-size:12px;margin-left:6px;transition:transform 0.2s;}
.timeline-card.collapsed .card-toggle{transform:rotate(-90deg);}
.timeline-card.collapsed .card-body{display:none;}
.card-body{padding:16px;}
.tab-label{display:inline-block;margin-bottom:12px;padding:6px 14px;color:#8C36AF;border-bottom:2px solid #8C36AF;font-size:13px;font-weight:600;}
.release-note{margin-bottom:12px;padding:8px 12px;background:#FFF3D9;color:#7A4B00;border-left:3px solid #D69A1E;border-radius:4px;font-size:12px;font-weight:700;}
.change-content{padding:10px 12px;background:#FAF7FC;border-left:3px solid #8C36AF;border-radius:4px;}
.change-list{padding-left:22px;font-size:13px;color:#2c3e50;}
.change-list li+li{margin-top:4px;}
@media (max-width:768px){
  body{padding:20px 10px;}
  .timeline::before{left:16px;}
  .timeline-item{width:100%;left:0!important;padding:8px 0 8px 40px;}
  .timeline-item .timeline-dot{left:8px!important;right:auto!important;}
  .header h1{font-size:22px;}
}
</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar" aria-label="Products">
    <span class="nav-label">Products:</span>
    <a href="ASERIES.html">A SERIES</a>
    <a href="LMAX.html">L MAX</a>
    <a href="H1G2.html">H1 G2</a>
    <a href="H3Pro.html">H3 PRO</a>
    <a href="H3SMART.html">H3 SMART</a>
    <a href="SMARTLOGGER.html">SMART LOGGER</a>
    <a href="EQ.html" class="current">EQ</a>
  </nav>
  <header class="header">
    <h1>EQ Changelog</h1>
    <div class="subtitle">Product Changelog Timeline</div>
    <div class="stats">
      <div>📋 Total <strong>5</strong> records</div>
      <div>🛠️ <strong>10</strong> update items</div>
      <div>📅 2025-08-22 ~ 2026-03-11</div>
    </div>
    <div class="latest-versions"><span>Latest EQ V2.0.13</span></div>
  </header>
  <div class="filter-bar">
    <span class="label">Filter:</span>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="EQ">EQ</button>
  </div>
  <main class="timeline" id="timeline"></main>
</div>
<script>
const releases=[
  {date:'2026-03-11',old:'V2.0.12',new:'V2.0.13',note:'Latest',items:[
    'Improved battery sampling stability'
  ]},
  {date:'2026-02-27',old:'V2.0.11',new:'V2.0.12',items:[
    'Software version compatibility optimization'
  ]},
  {date:'2025-12-12',old:'V2.0.09',new:'V2.0.11',items:[
    'Added compatibility with the LTC6813 / ADBMS1818_SPI_14S_4NTC version.',
    'Upgraded the software anti-misoperation (foolproof) version to R5.04'
  ]},
  {date:'2025-11-28',old:'V2.0.07',new:'V2.0.09',note:'Internal test version, not officially DCC-controlled',items:[
    'Added compatibility with the BQ76952_SPI_14S_4NTC version.',
    'Fixed an issue where, when the AFE is of type BQ76952 and the number of NTCs is fewer than seven, the virtual temperature deviates from the actual temperature.',
    'Upgraded the software anti-misoperation (foolproof) version to R5.03'
  ]},
  {date:'2025-08-22',old:'V2.0.06',new:'V2.0.07',items:[
    'Compatible with CQ6 batteries (maximum number of BMUs increased to 14);',
    'Software foolproof version upgraded to R5.02;',
    'Version number upgraded to R5.02_V2.0.07'
  ]}
];

const timeline=document.getElementById('timeline');

function escapeHtml(value){
  return value.replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});
}

function renderTimeline(){
  timeline.innerHTML=releases.map(function(release,index){
    const list=release.items.map(function(item){return '<li>'+escapeHtml(item)+'</li>';}).join('');
    const note=release.note?'<div class="release-note">'+escapeHtml(release.note)+'</div>':'';
    return '<article class="timeline-item '+(index%2===0?'left':'right')+'">'+
      '<div class="timeline-dot"></div>'+
      '<div class="timeline-card '+(index>=3?'collapsed':'')+'">'+
        '<button class="card-header" type="button" aria-expanded="'+(index<3)+'" aria-label="Toggle EQ '+release.new+'">'+
          '<span class="card-header-left"><span class="card-date">'+release.date+'</span><span class="card-product">EQ</span></span>'+
          '<span class="card-header-right"><span class="version-badge old">'+release.old+'</span><span class="version-arrow">→</span><span class="version-badge new">'+release.new+'</span><span class="card-toggle">▼</span></span>'+
        '</button>'+
        '<div class="card-body"><span class="tab-label">Key Account</span>'+note+'<div class="change-content"><ol class="change-list">'+list+'</ol></div></div>'+
      '</div>'+
    '</article>';
  }).join('');
}

timeline.addEventListener('click',function(event){
  const header=event.target.closest('.card-header');
  if(!header)return;
  const card=header.closest('.timeline-card');
  card.classList.toggle('collapsed');
  header.setAttribute('aria-expanded',String(!card.classList.contains('collapsed')));
});

renderTimeline();
</script>
</body>
</html>
